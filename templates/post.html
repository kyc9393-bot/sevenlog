<article class="post">
  <header class="post-header">
    <a href="{{ cat_url }}" class="post-cat" style="--cat-color: {{ cat_color }}">{{ cat_label }}</a>
    <h1>{{ title }}</h1>
    <div class="post-meta">
      <time datetime="{{ date_iso }}">{{ date_human }}</time> · 약 {{ reading_min }}분 읽기
    </div>
  </header>
  <div class="post-body">
{{ body }}
  </div>
  {{ ad_bottom }}
  <p class="partners-disclosure" style="margin-top:28px;padding:12px 16px;background:#f6f6fa;border-radius:10px;font-size:13px;color:#777;">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받을 수 있습니다.</p>
  <div class="post-tags">{{ tags }}</div>
</article>
{{ related }}
